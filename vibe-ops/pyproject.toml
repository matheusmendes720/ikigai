[project]
name = "vibe-ops"
version = "0.1.0"
# Must match the CI matrix (python-version: "3.11"). Without it uv defaults to
# ">=3.13" and silently provisions its own interpreter, ignoring the matrix.
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "sqlalchemy",
    "rich",
    "typer",
    "pyyaml",
    "chromadb",
    "tasklib",
    "python-frontmatter",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.7",
]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The RICE formula uses the multiplication sign (×) on purpose.
"src/pipeline/rice_exporter.py" = ["RUF002"]
# src/ is the flat import root for this package; the directory name itself is
# not a valid Python identifier, so N999 must be waived here.
"src/__init__.py" = ["N999"]
