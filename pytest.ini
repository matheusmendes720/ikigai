[pytest]
# The canonical suite (ADR-037, 2026-11-02). It used to point at the root
# `tests/` tree — the suite of the retired pre-ADR-037 runtime, which
# imported `sys_ikigai` and `src.mesh` directly. That tree is unpublished;
# this points at the suite that ships.
#
# The canonical entry is still `cd src/ikigai && poetry run pytest -m "not e2e"`.
# This file makes a bare `pytest` from the repository root collect the same
# suite, with the same paths on sys.path.
pythonpath = src src/ikigai/src
testpaths = src/ikigai/tests
# Most of the suite is `async def`. pytest-asyncio defaults to "strict", which
# skips an unmarked async test instead of failing it — the suite would report
# green without ever having run the write contract.
asyncio_mode = auto
