[mypy]
# The canonical paths only (ADR-037, 2026-11-02). The retired entries — `..`
# and `../..` — pointed at the pre-ADR-037 runtime and the fork mesh.
#
# The canonical mypy invocation is `poetry run mypy -p src.ikigai.src` from
# inside `src/ikigai/`, which uses that package's own `[tool.mypy]` section.
# This file governs a bare `mypy` run from the repository root.
mypy_path = src src/ikigai/src
explicit_package_bases = True
