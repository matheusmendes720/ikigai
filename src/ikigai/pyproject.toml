[tool.poetry]
name = "ikigai"
version = "0.2.0"
description = "Standalone IKIGAi meta-brain for the Algorithmic Life OS"
authors = ["Matheus + AI Agent"]
readme = "README.md"
packages = [{include = "mcp_server", from = "src"}, {include = "agents", from = "src"}, {include = "observability", from = "src"}, {include = "strategics", from = "src"}, {include = "ikigai_wrapper.py", from = "src"}, {include = "sys_ikigai", from = "../.."}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"
pyyaml = "^6.0"
python-frontmatter = "^1.0"
typer = ">=0.12"
rich = "^13.7"
mcp = "^1.1"
langgraph-checkpoint-sqlite = "^3.1"

# OpenTelemetry — single SDK, two OTLP exporters (LangSmith + Langfuse).
# contrib package versions track opentelemetry-api minor (b0 = beta but stable).
# P0-A 2026-09-10: ALL instrumentation packages aligned to the >0.49 family.
# The 0.48b0 line and >0.49 line are mutually exclusive (require different
# opentelemetry-instrumentation base). langchain>=0.48b0 requires the >0.49
# family, so all four contrib packages must follow.
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
opentelemetry-instrumentation-langchain = ">0.49"
opentelemetry-instrumentation-requests = ">0.49"
opentelemetry-instrumentation-sqlite3 = ">0.49"
opentelemetry-instrumentation-logging = ">0.49"

# HTTP client used by verify_traces.py
requests = "^2.31"

# Deep Agents harness runtime (B7.x). The MCP server itself does not depend
# on deepagents, but `--chat` mode in agents.deepagents_harness needs it.
# Mypy already silences the import (ignore_missing_imports) since this is
# an external dependency we don't type-check.
deepagents = ">=0.7"

# LangChain Anthropic provider — used by the deep agent chat path.
langchain-anthropic = ">=0.3"

# Click pinned to <8.2 — typer 0.12.x breaks with click >= 8.2 (Parameter.make_metavar()
# signature change). Without this pin, `python -m interfaces.cli v2 --help` crashes with
# "TypeError: Parameter.make_metavar() missing 1 required positional argument: 'ctx'".
# B4 fix 2026-09-10 added `v2 chat` command; pin prevents regression.
click = "<8.2"

[tool.poetry.scripts]
ikigai-maintainer-mcp = "run_mcp_server:main"
ikigai-deep-agent = "agents.deepagents_harness:main"
# `ikigai-chat` is the canonical short-form CLI for the IKIGAi Deep Agent
# harness (UX 2026-09-10: renamed from `dcode` because PowerShell has
# `dcode` aliased to `dcodetui` on this machine, causing the wrong
# command to run when user typed `dcode` in their shell).
# Per project convention, the harness is referred to as "dcode" (deep code)
# in roadmap/planning docs — but the installable CLI is `ikigai-chat`
# to avoid collisions with shell aliases and other agent runtimes.
# Mirrors ikigai-deep-agent exactly — same main() — so behavior is identical.
ikigai-chat = "agents.dcode_cli:main"
# Backward-compat alias (NOT recommended for new use; install via
# `uv pip install -e .` produces BOTH ikigai-chat AND dcode entries —
# but `dcode` will collide with PowerShell alias dcodetui on this machine).
# Keeping dcode as an entry point for systems without the PS alias collision.
dcode = "agents.dcode_cli:main"
# Path 3 MCP server for taskdog (read-only per
# docs/design-system/24-taskdog-paths-architecture.md). Subprocess-bound
# FastMCP instance with 3 tools: taskdog_read, taskdog_list,
# taskdog_supports_field. Wire in .mcp.json or external MCP client.
ikigai-taskdog-mcp = "mcp_server.__main__taskdog:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
hypothesis = "^6.95"
mypy = "^1.8"
ruff = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
# Poetry src-layout: cwd is `src/ikigai/`. The actual code root is
# `src/ikigai/src/` (poetry's "from = src"). The ikigai package lives at
# `src/ikigai/src/ikigai/__init__.py`.
#
# `mypy_path = "src"` adds `src/ikigai/src/` to sys.path so `from ikigai.X`
# resolves. We MUST NOT include `src/ikigai` in [files] because that would
# create a duplicate-source conflict (input scan vs mypy_path both resolve
# to src/ikigai/src/ikigai/__init__.py). Instead, mypy discovers the ikigai
# package via follow_imports from the other listed modules.
mypy_path = ["src", "..", "../.."]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = false
# Enumerate packages to check. Do NOT include "src/ikigai" (see above).
files = [
    "src/agents",
    "src/mcp_server",
    "src/observability",
    "src/strategics",
    "src/ikigai_wrapper.py",
]

[[tool.mypy.overrides]]
module = ["deepagents", "deepagents.backends", "langchain_anthropic", "msgpack", "yaml", "pytest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-v --tb=short"
# Phase 2 (zazzy-plotting-flask.md §4.1.A.8): DeprecationWarnings for
# `ikigai.entities.plan.task.TaskEntity` and `ikigai.vault.sync.TaskRecord`
# fire on construction (PAV-internal models with no production callers
# post 2026-08-31 archive). Tests that legitimately exercise these models
# suppress the warning so the suite stays green; new production code
# should not import them (use `contracts.Task` instead).
#
# Note: built-in `DeprecationWarning` has `__module__ == "_py_warnings"`
# (Python default), so we filter on the message regex instead of module.
filterwarnings = [
    "ignore:TaskEntity is a PAV/PAE-internal model:DeprecationWarning",
    "ignore:TaskRecord \\(ikigai.vault.sync\\) is the vault-extraction shape:DeprecationWarning",
]
