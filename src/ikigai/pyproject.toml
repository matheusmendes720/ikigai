[tool.poetry]
name = "ikigai"
version = "0.1.0"
description = "Standalone IKIGAi meta-brain for the Algorithmic Life OS"
authors = ["Matheus + AI Agent"]
readme = "README.md"
packages = [{include = "ikigai", from = "src"}, {include = "mcp_server", from = "src"}, {include = "agents", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"
pyyaml = "^6.0"
python-frontmatter = "^1.0"
typer = ">=0.12"
rich = "^13.7"
mcp = "^1.1"
langgraph-checkpoint-sqlite = "^3.1"

# OpenTelemetry — single SDK, two OTLP exporters (LangSmith + Langfuse).
# contrib package versions track opentelemetry-api minor (b0 = beta but stable).
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
opentelemetry-instrumentation-langchain = "^0.42b0"
opentelemetry-instrumentation-requests = "^0.48b0"
opentelemetry-instrumentation-sqlite3 = "^0.48b0"
opentelemetry-instrumentation-logging = "^0.48b0"

# HTTP client used by verify_traces.py
requests = "^2.31"

[tool.poetry.scripts]
ikigai-maintainer-mcp = "run_mcp_server:main"
ikigai-deep-agent = "agents.deepagents_harness:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
hypothesis = "^6.95"
mypy = "^1.8"
ruff = "^0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
# Poetry src-layout: cwd is `src/ikigai/`. The actual code root is
# `src/ikigai/src/` (poetry's "from = src"). The ikigai package lives at
# `src/ikigai/src/ikigai/__init__.py`.
#
# `mypy_path = "src"` adds `src/ikigai/src/` to sys.path so `from ikigai.X`
# resolves. We MUST NOT include `src/ikigai` in [files] because that would
# create a duplicate-source conflict (input scan vs mypy_path both resolve
# to src/ikigai/src/ikigai/__init__.py). Instead, mypy discovers the ikigai
# package via follow_imports from the other listed modules.
mypy_path = ["src", "..", "../.."]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = false
# Enumerate packages to check. Do NOT include "src/ikigai" (see above).
files = [
    "src/agents",
    "src/mcp_server",
    "src/observability",
    "src/strategics",
    "src/ikigai_wrapper.py",
]

[[tool.mypy.overrides]]
module = ["deepagents", "deepagents.backends", "langchain_anthropic", "msgpack", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
