[tool.poetry]
name = "ikigai"
version = "0.1.0"
description = "Standalone IKIGAi meta-brain for the Algorithmic Life OS"
authors = ["Matheus + AI Agent"]
readme = "README.md"
packages = [
    # Serverless / cloud-native pivot (ADR-037, 2026-11-01): the legacy
    # langchain/langgraph harness (agents), the local chat REPL (chat), the
    # stdio MCP servers (mcp_server), the paperclip bridge (plugins), the
    # OpenTelemetry stack (observability) and the langgraph API wrapper
    # (ikigai_wrapper) are PC-only and are no longer published. The canonical
    # MCP transport lives at `src/transport/mcp_server.py` (repo root) and the
    # data-layer contract surface in `src/contracts`.
    {include = "strategics", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pyyaml = "^6.0"
python-frontmatter = "^1.0"
typer = ">=0.12"
rich = "^13.7"
mcp = "^1.1"

# The store client is NOT declared here yet. psycopg and psycopg-pool belong
# in this table, and testcontainers[postgres] in the dev group, but poetry
# refuses to install when the lock was generated against a different
# pyproject — and the lock cannot be regenerated in this environment. Until
# `poetry lock` runs, the CI installs them into the venv directly. Add them
# here and regenerate the lock in the same change.

# The canonical MCP transport (`src/transport/mcp_server.py`, repo root) is
# exercised by this package's own suite (`tests/transport/`), so the SDK
# stays a declared dependency of the venv that runs it.
#
# Packaging note: the data layer is imported with a dotted prefix
# (`from src.contracts.dom import ...`), so it is addressed as `src.*` and
# needs the repository root on the path. This package's pytest config puts it
# there (`pythonpath = ["src", "../.."]`) and a container sets it explicitly.
# The distribution does not ship the data layer as a top-level package,
# because the import identity would then be `contracts`, not `src.contracts`.

[tool.poetry.scripts]
# The console scripts of the legacy harness (ikigai-maintainer-mcp,
# ikigai-deep-agent, paperclip, paperclipai-bridge) were removed with the
# serverless pivot (ADR-037): they only started the PC-local MCP server and
# the langgraph dev harness. The cloud harness is specified in
# specs/harness/ and is built serverless.

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
hypothesis = "^6.95"
mypy = "^1.8"
# Pinned to the same Ruff the other CI matrix entries resolve to
# (0.17.3). An open range would resolve to whatever Ruff is latest at CI
# time and silently change the gate.
ruff = "^0.17.3"
# NOTE: this used to live in a PEP 735 `[dependency-groups]` table. When both
# tables declare a group named "dev", Poetry 2.x resolves the group from
# `[dependency-groups]` only, which silently dropped pytest/ruff/mypy from
# poetry.lock and left the CI job without a runner. Keep every dev tool here.
types-pyyaml = ">=6.0.12.20260815"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
# py311 matches the project's python requirement (^3.11) and the rest of the
# monorepo (src/contracts, src/mesh, vibe-ops all target py311).
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]
# B008 (function call in default argument) is Typer's documented pattern
# for `typer.Option(...)` / `typer.Argument(...)` — false positive in this CLI module.
[tool.ruff.lint.per-file-ignores]
# Every entry that used to live here pointed at the retired harness
# (src/agents/**, src/mcp_server/**) and was removed with it (ADR-037).

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = false
# Canonical module identity for this package.
#
# The absolute imports inside the codebase are `src.ikigai.src.*`
# (repo root on sys.path). `mypy src/` (path-based) creates a SECOND,
# competing identity for the same files (`agents.*` vs
# `src.ikigai.src.agents.*`) and mypy then reports the package as
# "found twice" plus a cascade of bogus import errors.
#
# `mypy_path = ["../.."]` puts the REPO ROOT on the search path, so the
# only identity mypy can assign to `src/ikigai/src/**` is
# `src.ikigai.src.*` — exactly the identity used at runtime.
# `explicit_package_bases` + `namespace_packages` are required to use
# that base (the `src/` and `src/ikigai/` dirs have no __init__.py).
mypy_path = ["../.."]
explicit_package_bases = true
namespace_packages = true
# Third-party / sibling packages that ship no type information. Scoped
# narrowly so a genuinely missing local import is still an error.
follow_imports = "silent"

# NOTE: no `files` / `modules` key on purpose.
#
# `files = ["src/..."]` (path-based) reintroduces the competing identity
# described above; `modules = [...]` is silently resolved relative to
# the CURRENT directory and finds nothing. The gate is invoked with an
# explicit canonical package instead:
#
#     poetry run mypy -p src.ikigai.src
#
# `mypy_path = ["../.."]` (repo root) is what makes that package name
# resolvable from this directory.

[[tool.mypy.overrides]]
module = [
    "contracts.*",
    "mesh.*",
    "pytest",
    "src.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "pytest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-v --tb=short"
# Most of this suite is `async def`: the write contract, the transport's error
# translation and the vault sync are all asynchronous. pytest-asyncio defaults
# to "strict", which SKIPS an unmarked async test rather than failing it — a
# suite with no asyncio_mode runs a fraction of itself and still reports
# green. "auto" is what makes them run.
asyncio_mode = "auto"
# Phase 2 (zazzy-plotting-flask.md §4.1.A.8): DeprecationWarnings for
# `ikigai.entities.plan.task.TaskEntity` and `ikigai.vault.sync.TaskRecord`
# fire on construction (PAV-internal models with no production callers
# post 2026-08-31 archive). Tests that legitimately exercise these models
# suppress the warning so the suite stays green; new production code
# should not import them (use `contracts.Task` instead).
#
# Note: built-in `DeprecationWarning` has `__module__ == "_py_warnings"`
# (Python default), so we filter on the message regex instead of module.
filterwarnings = [
    "ignore:TaskEntity is a PAV/PAE-internal model:DeprecationWarning",
    "ignore:TaskRecord \\(ikigai.vault.sync\\) is the vault-extraction shape:DeprecationWarning",
]
