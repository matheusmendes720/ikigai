[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (storage + pipeline)
    e2e: End-to-end tests (CLI invocation)
    property: Property-based tests (Hypothesis)
    slow: Slow tests (>1s)
# Orphan tests preserved for future PAV CLI/TUI restoration
# Each orphan test calls `pytest.skip(..., allow_module_level=True)` at its top,
# because the deleted `operational.cli` package is required for collection.
# (per memory: pav-cli-tui-future-feature-2026-08-27)
filterwarnings =
    ignore::DeprecationWarning:frontmatter
