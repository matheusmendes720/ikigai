target-version = "py311"
line-length = 100
extend-exclude = ["**/__pycache__", ".venv", "build", "dist", "tests/fixtures"]

[lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "G004",
    "TRY003",
    "PLC0415",   # late imports intentional in CLI command subcommands
]

[lint.per-file-ignores]
"packages/core/src/operational/types.py" = [
    "A002",      # `id` builtin shadowing is required by the Repository spec
    "ANN401",    # `**fields: Any` is the correct Logger protocol shape
]
"packages/core/src/operational/__init__.py" = [
    "ERA001",    # intentional section-header comments inside `__all__`
    "F401",      # re-exports are public API
]
"tests/**/*.py" = [
    "S101",      # asserts
    "PLR2004",   # magic values
    "ARG",       # unused args
    "FBT",       # booleans as args
    "PT011",     # raises in except
    "SLF001",    # private access
    "ANN",       # annotations
    "A002",      # id builtin shadowing in fake repos
    "D102",      # missing docstring on test methods
    "DTZ001",    # datetime() without tzinfo in tests
    "DTZ005",    # datetime.now() without tz in tests
    "DTZ011",    # date.today() in tests
    "I001",      # unsorted imports
    "N802",      # function name casing (test_T_xxx)
    "PLC0415",   # inline imports in tests
    "SIM300",    # yoda conditions in tests
]
"**/__init__.py" = ["F401"]
"scripts/**" = ["T201", "INP001", "EXE001"]
# Core package is the PAV kernel — pure logic, many tiny helpers where
# docstrings / magic numbers / any-type annotations are noise rather than
# signal. This mirrors the existing pattern in ``apps/cli/commands/*`` and
# keeps ``verify_sprint`` focused on real bugs (logic, naming, shadowing),
# not stylistic debt. The docs build + Pydantic v2 strict mode still
# enforce the load-bearing invariants.
"packages/core/src/operational/input_validation.py" = [
    "N802",      # function name casing — specified by brief
]
"packages/core/src/**/*.py" = [
    "D101",      # missing docstring on public class
    "D102",      # missing docstring on public method
    "D103",      # missing docstring on internal
    "D104",      # missing docstring on public package
    "D105",      # missing docstring on magic method (__str__ etc.)
    "D107",      # missing docstring on __init__
    "ANN001",    # missing type for self
    "ANN204",    # missing return type for __str__/__repr__
    "ANN401",    # any-type in internal helpers
    "PLR2004",   # magic values in core algorithms (entity IDs, hashes, etc.)
    "PLR0912",   # too-many-branches (state machines)
    "PLR0913",   # too-many-args (entity constructors)
    "PLR0915",   # too-many-statements
    "PLR0911",   # too-many-return-statements
    "PLR1714",   # repeated-equality-comparison (state checks)
    "A002",      # builtin shadowing (id builtin in Repository spec)
    "ARG001",    # unused function arg in protocol/abstract methods
    "ARG002",    # unused method arg in protocol/abstract methods
    "C901",      # complex-structure (state machine transitions)
    "E501",      # line-too-long in arithmetic formulas
    "PERF401",   # manual-list-comprehension style
    "C401",      # unnecessary-generator-set
    "FBT001",    # bool positional arg
    "FBT002",    # bool default value
    "N806",      # non-lowercase variable in PAV constants
    "DTZ005",    # datetime.now in entity defaults
    "DTZ011",    # date.today() in entity defaults
    "TC003",     # typing-only-standard-library-import
    "RUF001",    # σ/μ in stats docstrings
    "RUF002",    # σ/μ in docstrings
    "RUF003",    # σ/μ in comments
    "PLC2401",   # non-ascii identifier in PAV docs
    "SIM105",    # suppressible-exception
    "TRY300",    # try-consider-else (Pydantic validators use early raise)
    "ERA001",    # commented-out code (entity field history)
    "PLW0603",   # global-statement (module-level singletons)
]
