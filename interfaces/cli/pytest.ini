[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --showlocals
    # Use workspace-local tmp dir to avoid Windows PermissionError on
    # C:\Users\<user>\AppData\Local\Temp\pytest-of-<user>\ when that dir
    # is locked by a prior crashed pytest run.
    --basetemp=.pytest-tmp
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (storage + pipeline)
