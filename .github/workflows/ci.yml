name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-review-checks:
    name: Code Review — Type & Test Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff vs base

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Nothing in this job uses `uv`: the checks run on Poetry (the package's
      # own environment) and on the runner's Python. Measured: `uv` appears
      # nowhere else in `.github/`.
      #
      # The step stays, but it cannot kill the checks: the release CDN answered
      # 504 twice in a row (2026-11-09) and the job died on the DOWNLOAD —
      # before a single check ran, and only on PRs, because this job is
      # `if: pull_request`. A flaky installer is not a gate.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        continue-on-error: true

      - name: Install Poetry
        uses: snok/install-poetry@v1

      # The review runs the Ikigai package in ITS environment (its canonical
      # mypy target is `-p src.ikigai.src`) and runs the root tests with the
      # Ikigai interpreter. Without this environment the review would report
      # "nothing was checked" instead of a real result.
      - name: Install Ikigai environment (Poetry)
        working-directory: src/ikigai
        run: poetry install

      - name: Type check — changed files only (mypy, per package)
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --type-only \
            --github-annotations \
            --gate

      - name: Test suite review — changed files only
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --test-only \
            --missing \
            --review-format \
            --gate

      - name: Full master review report
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --review-format || true
        continue-on-error: true

  quality-gates:
    name: Quality Gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ikigai
            path: src/ikigai
            python: "3.11"
            manager: poetry
            ruff_target: src/
            # mypy MUST NOT be invoked with a path here.
            #
            # The package's canonical module identity is `src.ikigai.src.*`
            # (repo root on sys.path — see the absolute imports in the
            # codebase). `mypy src/` walks the same files under a SECOND,
            # competing identity (`agents.*`) and mypy then aborts with
            # "Source file found twice under different module names".
            #
            # The canonical, path-free invocation is documented in
            # `src/ikigai/pyproject.toml` ([tool.mypy] section).
            mypy_target: -p src.ikigai.src
          # The canonical data layer (ADR-037): `src/contracts` (the DOM),
          # `src/data` (the Postgres client and repository), `src/services`
          # (the domain rules — the only writer of the store) and
          # `src/transport` (MCP over the services). None of them has a
          # pyproject.toml, so they are imported as `src.data.*` and can only
          # be linted here. Their tests live in `src/ikigai/tests/` and run
          # under the `ikigai` entry, which is where psycopg and
          # testcontainers are installed.
          #
          # `src-contracts` is pure Pydantic data models (no business logic);
          # mypy adds no value over ruff for this surface.
          - package: src-contracts
            path: src/contracts
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          - package: src-data
            path: src/data
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          - package: src-services
            path: src/services
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          - package: src-transport
            path: src/transport
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          # The Telegram client. It is PUBLISHED code — it ships in the image
          # and it speaks to the api and to the agent — and it was the one
          # package the matrix did not gate: a file under `src/bot/` could
          # fail the style rules and nobody would say so, because the gate
          # that would have said so was not there.
          - package: src-bot
            path: src/bot
            python: "3.11"
            manager: ruff-only
            ruff_target: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        if: matrix.manager == 'poetry'

      - name: Install ruff (ruff-only manager)
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        # The SAME version the ikigai package pins (0.17.3). An open range
        # resolves to whatever Ruff is latest at CI time, so the gate changes
        # its own verdict between runs — a green run yesterday is not a green
        # run today, and a red run here can be red only because the formatter
        # moved. A gate that moves with the day is not a gate.
        run: |
          pip install --quiet ruff==0.17.3

      - name: Run quality gates — ruff-only (${{ matrix.package }})
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        run: |
          ruff check ${{ matrix.ruff_target }}
          ruff format --check ${{ matrix.ruff_target }}

      - name: Run quality gates — poetry (${{ matrix.package }})
        if: matrix.manager == 'poetry'
        working-directory: ${{ matrix.path }}
        run: |
          poetry install
          # The store tests (src/ikigai/tests/store/) reach a real Postgres
          # through testcontainers, so the driver and the container runtime
          # have to be in the same environment that runs pytest. Both are
          # declared in pyproject.toml and pinned in poetry.lock, so
          # `poetry install` brings them in — installing them by hand here
          # would put the CI's versions outside the lock, which is exactly
          # the drift the manifest is supposed to remove.
          poetry run ruff check ${{ matrix.ruff_target }}
          poetry run ruff format --check ${{ matrix.ruff_target }}
          poetry run mypy ${{ matrix.mypy_target || matrix.ruff_target }}
          poetry run pytest -m "not e2e"

  container:
    name: Container
    runs-on: ubuntu-latest
    # The image is what the service ships as, and the compose file is what
    # ships it. Both are checked here — on every pull request, before the
    # deploy workflow ever sees the branch. A compose file that no longer
    # interpolates, or an image that no longer builds, has to fail HERE and
    # not on the server, at the deploy, with the service down.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # `docker compose config` resolves every substitution, and a missing
      # one is an error — so the secrets it insists on are named here as
      # placeholders. This checks the SHAPE of the compose file, never a
      # secret's value.
      - name: The compose file resolves
        env:
          IKIGAI_DB_PASSWORD: ci-placeholder
          IKIGAI_BOT_TOKEN: ci-placeholder
          IKIGAI_BOT_ALLOWED_CHAT_IDS: ci-placeholder
          IKIGAI_WS_TOKEN: ci-placeholder
          # The harness (the agent's container) refuses to start without a
          # provider endpoint. It is named here for the same reason as the
          # others: the compose must RESOLVE, and the value is never the point.
          HARNESS_PROVIDER_BASE_URL: https://ci-placeholder.invalid
        # The provider's KEY is no longer a substitution: it is a compose
        # SECRET backed by a file, so `config` has to find that file. It is
        # gitignored and therefore absent in a clone, which is the whole point
        # of it — so the runner writes a placeholder first. A step that only
        # resolved substitutions would pass here and fail on the box, where
        # the mount is real.
        run: |
          mkdir -p deploy/secrets
          printf '%s' 'ci-placeholder' > deploy/secrets/harness_provider_key
          printf '%s' 'ci-placeholder' > deploy/secrets/deepseek_api_key
          docker compose -f deploy/compose.yml config --quiet

      - name: The image builds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha

      # The harness has its OWN image, because the agent is external
      # (ADR-037 D7) and does not belong in the canonical service's build. A
      # harness image that no longer builds is a container that cannot come
      # up — so it is checked HERE, on every pull request, with the same
      # rigour as the canonical one.
      - name: The harness image builds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/harness/Dockerfile
          push: false
          cache-from: type=gha

  # REMOVED 2026-11-02 (ADR-037 cut) — the jobs below gated surfaces that
  # are not published any more:
  #
  #   review-queue-worker-contract  ran `interfaces/cli/tests/*` — the fork
  #     CLI, unpublished with the rest of the pre-ADR-037 runtime.
  #   backtest-pipeline             drove a taskdog-server over HTTP and
  #     called `scripts/backtest/run_backtest.sh` — neither the scripts tree
  #     nor the tool is published any more.
  #   drift-regression              called `tools/backtest/drift_regression.py`,
  #     which does not exist on this branch.
  #
  # The gate that remains is the one that measures what ships: the drift net
  # in `src/ikigai/tests/` (canonical scope, layering, versioning, and the
  # published surface itself) plus ruff and mypy over the canonical packages.
  #
  # NOTE: operational-e2e and git-hooks jobs were REMOVED 2026-08-31 — PAV
  # kernel archived to archive/legacy-pav/src-operational/. The archived
  # package retains its own test suite (uv run pytest from inside the
  # archive) but is not gated by this CI workflow.
