name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-review-checks:
    name: Code Review — Type & Test Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff vs base

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Type check — changed files only (mypy strict)
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --type-only \
            --strict \
            --github-annotations

      - name: Test suite review — changed files only
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --test-only \
            --missing \
            --review-format

      - name: Full master review report
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --review-format || true
        continue-on-error: true

  quality-gates:
    name: Quality Gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ikigai
            path: src/ikigai
            python: "3.11"
            manager: poetry
            ruff_target: src/
          - package: vibe-ops
            path: vibe-ops
            python: "3.11"
            manager: uv
            ruff_target: src/
          # Phase 5 (zazzy-plotting-flask.md §5): extend matrix to cover
          # the flat-layout packages that imports-flow through `life mesh show`
          # and the operator TUI. Flat packages use `ruff_target: .` so ruff
          # walks the package root instead of a `src/` subdir.
          #
          # `src-contracts` and `src-mesh` use the `ruff-only` manager:
          #   - src-contracts is pure Pydantic data models (no business
          #     logic); mypy adds no value over ruff for this surface.
          #   - src-mesh has no pyproject.toml (imported as `src.mesh.*`
          #     via PYTHONPATH=src), so it can't install via `uv sync`.
          # Tests for both are exercised transitively by `interfaces-cli`
          # matrix entry which imports from `src.mesh` + `src.contracts`.
          - package: interfaces-cli
            path: interfaces/cli
            python: "3.11"
            manager: uv
            ruff_target: .
          - package: src-contracts
            path: src/contracts
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          - package: src-mesh
            path: src/mesh
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          # Phase 9.1: v2 nodes smoke tests — runs with -m "not integration"
          # to exclude @pytest.mark.integration (Phase 8.5 convention)
          - package: v2-nodes
            path: src/ikigai
            python: "3.11"
            manager: uv
            ruff_target: src/
          # NOTE: PAV kernel (src/operational/) ARCHIVED 2026-08-31 — see
          # archive/legacy-pav/SUPERSEDED.md and ADR-013. The archived
          # package remains self-contained (`uv sync && uv run pytest`
          # works inside archive/legacy-pav/src-operational/) but is not
          # part of the canonical CI matrix.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        if: matrix.manager == 'uv' || matrix.manager == 'ruff-only'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        if: matrix.manager == 'poetry'

      - name: Cache uv artifacts
        uses: actions/cache@v4
        if: matrix.manager == 'uv'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}

      - name: Install ruff (ruff-only manager)
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --quiet ruff

      - name: Run quality gates — ruff-only (${{ matrix.package }})
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        run: |
          ruff check ${{ matrix.ruff_target }}
          ruff format --check ${{ matrix.ruff_target }}

      - name: Run quality gates — uv (${{ matrix.package }})
        if: matrix.manager == 'uv'
        working-directory: ${{ matrix.path }}
        env:
          # interfaces-cli imports src.contracts + src.mesh; expose the
          # repo-root src/ directory to mypy and pytest discovery.
          MYPYPATH: ../..
          PYTHONPATH: ../..
        run: |
          uv sync --all-packages
          uv run ruff check ${{ matrix.ruff_target }}
          uv run ruff format --check ${{ matrix.ruff_target }}
          uv run mypy ${{ matrix.ruff_target }}
          uv run pytest -m "not e2e"

      - name: Run quality gates — poetry (${{ matrix.package }})
        if: matrix.manager == 'poetry'
        working-directory: ${{ matrix.path }}
        run: |
          poetry install
          poetry run ruff check ${{ matrix.ruff_target }}
          poetry run ruff format --check ${{ matrix.ruff_target }}
          poetry run mypy ${{ matrix.ruff_target }}
          poetry run pytest -m "not e2e"

      # Phase 9.1: v2 node smoke tests (exclude @pytest.mark.integration per Phase 8.5)
      - name: Run v2 node tests (quality-gates)
        if: matrix.package == 'v2-nodes'
        working-directory: ${{ matrix.path }}
        env:
          IKIGAI_FAKE_LLM: "1"
          PYTHONPATH: ../..
        run: |
          uv sync --all-packages
          uv run pytest \
            -m "not integration" \
            interfaces/cli/tests/test_v2_skill_dispatch.py \
            src/ikigai/src/agents/v2/tests/test_mcp_bridge.py \
            src/ikigai/src/agents/v2/tests/test_mcp_client.py \
            src/ikigai/src/agents/v2/tests/test_bridge_observability.py \
            src/ikigai/src/agents/v2/tests/test_phase_8_2_wiring.py \
            tests/ikigai/agents/v2/test_tag_and_persist_node.py \
            src/ikigai/tests/test_v2_interface_dispatch.py \
            src/ikigai/tests/test_v2_e2e_smoke.py \
            src/ikigai/tests/mcp/test_fast_mcp_client_e2e_stdio.py

  mcp-gateway-contract:
    name: MCP Gateway Contract (B3.6)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install MCP Python SDK
        run: pip install --quiet mcp

      - name: Install ikigai + mcp_server deps
        working-directory: src/ikigai
        run: |
          uv sync --all-packages || true
          # uv may fail if pyproject.toml expects poetry; fall back to pip install
          pip install --quiet -e . || true

      - name: Run MCP gateway contract test
        run: |
          python scripts/mcp_inspect.py

  review-queue-worker-contract:
    name: Review Queue Worker Contract (B4.3)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run review queue worker contract test
        run: |
          PYTHONPATH=. python -m pytest interfaces/cli/tests/test_review_queue_worker.py interfaces/cli/tests/test_review_queue_worker_e2e.py -v

  # Phase 9.1: dedicated v2 nodes smoke job — runs with --confcutdir=. for
  # dual-module identity fix (per Phase 8.9 / ADR-014) and IKIGAI_FAKE_LLM=1
  # for $0 CI mode. Runs the same 9 test paths as quality-gates v2-nodes
  # entry but without the -m "not integration" filter so integration tests
  # are included (fast feedback before the full quality-gates run completes).
  v2-nodes-smoke:
    name: V2 Nodes Smoke (${{ matrix.test_path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_path:
          - interfaces/cli/tests/test_v2_skill_dispatch.py
          - src/ikigai/src/agents/v2/tests/test_mcp_bridge.py
          - src/ikigai/src/agents/v2/tests/test_mcp_client.py
          - src/ikigai/src/agents/v2/tests/test_bridge_observability.py
          - src/ikigai/src/agents/v2/tests/test_phase_8_2_wiring.py
          - tests/ikigai/agents/v2/test_tag_and_persist_node.py
          - src/ikigai/tests/test_v2_interface_dispatch.py
          - src/ikigai/tests/test_v2_e2e_smoke.py
          - src/ikigai/tests/mcp/test_fast_mcp_client_e2e_stdio.py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-v2-nodes-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}

      - name: Install dependencies
        env:
          IKIGAI_FAKE_LLM: "1"
        run: |
          uv sync --all-packages

      - name: Run v2 node smoke tests
        env:
          IKIGAI_FAKE_LLM: "1"
        run: |
          uv run pytest --confcutdir=. ${{ matrix.test_path }}

  # NOTE: operational-e2e and git-hooks jobs REMOVED 2026-08-31 — PAV
  # kernel archived to archive/legacy-pav/src-operational/. The archived
  # package retains its own test suite (uv run pytest from inside the
  # archive) but is not gated by this CI workflow.
