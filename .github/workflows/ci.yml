name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-review-checks:
    name: Code Review — Type & Test Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff vs base

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Type check — changed files only (mypy strict)
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --type-only \
            --strict \
            --github-annotations

      - name: Test suite review — changed files only
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --test-only \
            --missing \
            --review-format

      - name: Full master review report
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --review-format || true
        continue-on-error: true

  quality-gates:
    name: Quality Gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: operational-core
            path: src/operational/packages/core
            python: "3.11"
            manager: uv
          - package: ikigai
            path: src/ikigai
            python: "3.11"
            manager: poetry
          - package: vibe-ops
            path: vibe-ops
            python: "3.11"
            manager: uv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        if: matrix.manager == 'uv'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        if: matrix.manager == 'poetry'

      - name: Cache uv artifacts
        uses: actions/cache@v4
        if: matrix.manager == 'uv'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}

      - name: Run quality gates — uv (${{ matrix.package }})
        if: matrix.manager == 'uv'
        working-directory: ${{ matrix.path }}
        run: |
          uv sync --all-packages
          uv run ruff check src/
          uv run ruff format --check src/
          uv run mypy src/
          uv run pytest -m "not e2e"

      - name: Run quality gates — poetry (${{ matrix.package }})
        if: matrix.manager == 'poetry'
        working-directory: ${{ matrix.path }}
        run: |
          poetry install
          poetry run ruff check src/
          poetry run ruff format --check src/
          poetry run mypy src/
          poetry run pytest -m "not e2e"

  mcp-gateway-contract:
    name: MCP Gateway Contract (B3.6)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install MCP Python SDK
        run: pip install --quiet mcp

      - name: Install ikigai + mcp_server deps
        working-directory: src/ikigai
        run: |
          uv sync --all-packages || true
          # uv may fail if pyproject.toml expects poetry; fall back to pip install
          pip install --quiet -e . || true

      - name: Run MCP gateway contract test
        run: |
          python scripts/mcp_inspect.py

  review-queue-worker-contract:
    name: Review Queue Worker Contract (B4.3)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install pytest
        run: pip install --quiet pytest

      - name: Run review queue worker contract test
        run: |
          PYTHONPATH=. python -m pytest interfaces/cli/tests/test_review_queue_worker.py -v

  operational-e2e:
    name: Operational E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v4
      - working-directory: src/operational
        run: |
          uv sync
          uv run pytest -m e2e

  vibe-ops-scratch:
    name: Vibe-ops Scratch Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v4
      - name: Vibe-ops scratch smoke test
        run: |
          cd vibe-ops && uv run python -m pytest scratch/ -q --no-header

  git-hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v4
      - working-directory: src/operational
        run: uv run pre-commit run --all-files
