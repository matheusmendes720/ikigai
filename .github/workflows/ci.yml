name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-review-checks:
    name: Code Review — Type & Test Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff vs base

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      # The review runs the Ikigai package in ITS environment (its canonical
      # mypy target is `-p src.ikigai.src`) and runs the root tests with the
      # Ikigai interpreter. Without this environment the review would report
      # "nothing was checked" instead of a real result.
      - name: Install Ikigai environment (Poetry)
        working-directory: src/ikigai
        run: poetry install

      - name: Type check — changed files only (mypy, per package)
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --type-only \
            --github-annotations \
            --gate

      - name: Test suite review — changed files only
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --test-only \
            --missing \
            --review-format \
            --gate

      - name: Full master review report
        run: |
          python .github/scripts/code_review.py \
            --base ${{ github.base_ref }} \
            --review-format || true
        continue-on-error: true

  quality-gates:
    name: Quality Gates (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ikigai
            path: src/ikigai
            python: "3.11"
            manager: poetry
            ruff_target: src/
            # mypy MUST NOT be invoked with a path here.
            #
            # The package's canonical module identity is `src.ikigai.src.*`
            # (repo root on sys.path — see the absolute imports in the
            # codebase). `mypy src/` walks the same files under a SECOND,
            # competing identity (`agents.*`) and mypy then aborts with
            # "Source file found twice under different module names".
            #
            # The canonical, path-free invocation is documented in
            # `src/ikigai/pyproject.toml` ([tool.mypy] section).
            mypy_target: -p src.ikigai.src
          - package: vibe-ops
            path: vibe-ops
            python: "3.11"
            manager: uv
            ruff_target: src/
          # Phase 5 (zazzy-plotting-flask.md §5): extend matrix to cover
          # the flat-layout packages that imports-flow through `life mesh show`
          # and the operator TUI. Flat packages use `ruff_target: .` so ruff
          # walks the package root instead of a `src/` subdir.
          #
          # `src-contracts` and `src-mesh` use the `ruff-only` manager:
          #   - src-contracts is pure Pydantic data models (no business
          #     logic); mypy adds no value over ruff for this surface.
          #   - src-mesh has no pyproject.toml (imported as `src.mesh.*`
          #     via PYTHONPATH=src), so it can't install via `uv sync`.
          # Tests for both are exercised transitively by `interfaces-cli`
          # matrix entry which imports from `src.mesh` + `src.contracts`.
          - package: interfaces-cli
            path: interfaces/cli
            python: "3.11"
            manager: uv
            ruff_target: .
          - package: src-contracts
            path: src/contracts
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          - package: src-mesh
            path: src/mesh
            python: "3.11"
            manager: ruff-only
            ruff_target: .
          # NOTE: PAV kernel (src/operational/) ARCHIVED 2026-08-31 — see
          # archive/legacy-pav/SUPERSEDED.md and ADR-013. The archived
          # package remains self-contained (`uv sync && uv run pytest`
          # works inside archive/legacy-pav/src-operational/) but is not
          # part of the canonical CI matrix.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        if: matrix.manager == 'uv' || matrix.manager == 'ruff-only'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        if: matrix.manager == 'poetry'

      - name: Cache uv artifacts
        uses: actions/cache@v4
        if: matrix.manager == 'uv'
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}

      - name: Install ruff (ruff-only manager)
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --quiet ruff

      - name: Run quality gates — ruff-only (${{ matrix.package }})
        if: matrix.manager == 'ruff-only'
        working-directory: ${{ matrix.path }}
        run: |
          ruff check ${{ matrix.ruff_target }}
          ruff format --check ${{ matrix.ruff_target }}

      - name: Run quality gates — uv (${{ matrix.package }})
        if: matrix.manager == 'uv'
        working-directory: ${{ matrix.path }}
        env:
          # interfaces-cli imports src.contracts + src.mesh; expose the
          # repo-root src/ directory to mypy and pytest discovery.
          MYPYPATH: ../..
          PYTHONPATH: ../..
        run: |
          uv sync --all-packages
          uv run ruff check ${{ matrix.ruff_target }}
          uv run ruff format --check ${{ matrix.ruff_target }}
          uv run mypy ${{ matrix.mypy_target || matrix.ruff_target }}
          uv run pytest -m "not e2e"

      - name: Run quality gates — poetry (${{ matrix.package }})
        if: matrix.manager == 'poetry'
        working-directory: ${{ matrix.path }}
        run: |
          poetry install
          poetry run ruff check ${{ matrix.ruff_target }}
          poetry run ruff format --check ${{ matrix.ruff_target }}
          poetry run mypy ${{ matrix.mypy_target || matrix.ruff_target }}
          poetry run pytest -m "not e2e"

  mcp-gateway-contract:
    name: MCP Gateway Contract (B3.6)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install MCP Python SDK
        run: pip install --quiet mcp

      - name: Install ikigai + mcp_server deps
        working-directory: src/ikigai
        run: |
          uv sync --all-packages || true
          # uv may fail if pyproject.toml expects poetry; fall back to pip install
          pip install --quiet -e . || true

      - name: Run MCP gateway contract test
        run: |
          python scripts/mcp_inspect.py

  review-queue-worker-contract:
    name: Review Queue Worker Contract (B4.3)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install pytest
        run: pip install --quiet pytest

      # The review-queue worker tests import interfaces/cli/__init__.py,
      # which pulls in src.contracts (pydantic) and the Typer CLI layer.
      # Installing pytest alone makes collection fail with
      # ModuleNotFoundError: No module named 'pydantic'.
      - name: Install test dependencies
        run: pip install --quiet pydantic typer rich

      - name: Run review queue worker contract test
        run: |
          PYTHONPATH=. python -m pytest interfaces/cli/tests/test_review_queue_worker.py interfaces/cli/tests/test_review_queue_worker_e2e.py -v

  # M129: backtest pipeline runs on every PR — 10-step validation
  # (health check, scenarios, harness, judge, report, drift, LLM judge,
  # baseline archive, integrity manifest, signature). Posts a summary
  # comment with the judge's overall score.
  backtest-pipeline:
    name: Backtest Pipeline (M114g/M115-M127)
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync || true
          # pyyaml is REQUIRED by the backtest tools (scenario parsing);
          # langchain-anthropic is optional (llm_judge degrades to stub).
          pip install --quiet pytest typer rich pyyaml || true

      # The backtest harness drives a real taskdog-server over HTTP.
      # The server lives outside this repo (PyPI: taskdog-server), so the
      # job must start it itself — otherwise the health check in
      # scripts/backtest/run_backtest.sh fails with exit 2.
      # `uv tool install` resolves its own interpreter (taskdog-server
      # requires Python >=3.12 while this job runs on 3.11).
      - name: Install taskdog-server
        run: |
          uv tool install taskdog-server
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Server + pipeline run in ONE step: a background process started in
      # a separate step is not guaranteed to survive between steps.
      - name: Run backtest pipeline (with skip-gen for CI speed)
        run: |
          set -euo pipefail
          SERVER_BIN="$(command -v taskdog-server || echo "$HOME/.local/bin/taskdog-server")"
          "$SERVER_BIN" --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/taskdog-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:8000/api/v1/tasks?limit=1" || true)
            if [ "$code" = "200" ]; then
              echo "taskdog-server is up (HTTP 200)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "taskdog-server failed to start:"
              cat "$RUNNER_TEMP/taskdog-server.log"
              exit 1
            fi
            sleep 1
          done

          bash scripts/backtest/run_backtest.sh --skip-gen

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            reports/backtest-Q1.md
            reports/backtest-drift.md
            reports/backtest-trend.md
            reports/baselines/
          retention-days: 14

  # M136: drift regression check — fails CI if any drift kind grew >10%
  # week-over-week OR a new drift kind appeared.
  drift-regression:
    name: Drift Regression Check (M136)
    runs-on: ubuntu-latest
    needs: backtest-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync || true
          pip install --quiet pytest typer rich || true

      - name: Run drift regression check
        run: |
          PYTHONPATH=. python tools/backtest/drift_regression.py check --snapshot --threshold 0.10

      - name: Generate regression report
        if: always()
        run: |
          PYTHONPATH=. python tools/backtest/drift_regression.py report > reports/drift-regression.md || true

  # NOTE: operational-e2e and git-hooks jobs REMOVED 2026-08-31 — PAV
  # kernel archived to archive/legacy-pav/src-operational/. The archived
  # package retains its own test suite (uv run pytest from inside the
  # archive) but is not gated by this CI workflow.
