name: Deploy

# The CI/CD half of the service (ADR-039).
#
# The image is built ONCE, on the runner, and the server runs THAT image —
# not one it builds itself. A server that builds on deploy compiles the
# deploy, and a deploy that compiles something else than CI tested is a
# deploy nobody verified.
#
# TWO images, because the compose has two kinds of container: the canonical
# Python service (the api, the websocket, the ingestion and the bot) and the
# AGENT, which is external (ADR-037 D7) and therefore has its own runtime and
# its own image. `docker compose pull` pulls EVERY image the compose names —
# so an image the pipeline does not publish is a deploy that cannot finish.
#
# The gates in `ci.yml` run first — a red gate here means the code was never
# tested, and the deploy skips itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping deploys would race for the same
# compose project, and the loser would leave the services in a state neither
# of them chose.
concurrency:
  group: ikigai-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish the images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      harness_image: ${{ steps.harness_image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: The image name
        id: image
        run: |
          # GHCR paths are lowercase; the repository owner is not always
          # spelled that way in the event payload.
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ikigai" >> "$GITHUB_OUTPUT"

      - name: The harness image name
        id: harness_image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ikigai-harness" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The agent has its OWN image (ADR-037 D7): the model runtime does not
      # belong in the canonical service's build. It is published HERE, by the
      # same pipeline, because the compose names it and `docker compose pull`
      # pulls every image the compose names — an image nobody published is a
      # deploy that stops at the pull.
      - name: Harness image metadata
        id: harness_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.harness_image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the harness image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/harness/Dockerfile
          push: true
          tags: ${{ steps.harness_meta.outputs.tags }}
          labels: ${{ steps.harness_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: The image tags to run
        id: target
        run: |
          # The same tag the metadata action pushed: `sha-<commit>`. The
          # publisher and the deployer must name the image the same way — a
          # deploy that pulls a tag nobody pushed stops on a manifest that
          # does not exist.
          echo "tag=${{ needs.build.outputs.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "harness=${{ needs.build.outputs.harness_image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # The deploy is configured by four secrets, and a deploy that is not
      # configured must say WHICH are missing. The action's own failure
      # ("missing server host") names one of them and leaves the other three
      # to a guess — and the owner has never seen these names before.
      - name: The deploy is configured
        env:
          DEPLOY_HOST: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.IKIGAI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.IKIGAI_DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("IKIGAI_DEPLOY_HOST")
          [ -n "$DEPLOY_USER" ] || missing+=("IKIGAI_DEPLOY_USER")
          [ -n "$DEPLOY_KEY" ] || missing+=("IKIGAI_DEPLOY_SSH_KEY")
          [ -n "$DEPLOY_PATH" ] || missing+=("IKIGAI_DEPLOY_PATH")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the deploy is not configured — missing ${missing[*]}"
            echo "Set them in the repository: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        # THE VALUES ARE INTERPOLATED INTO THE SCRIPT, and not carried by the
        # action's `envs:`. Measured on two deploys: with `envs:` set, the
        # remote script received NONE of them — `bash: line 3:
        # IKIGAI_DEPLOY_PATH: the deploy path is not set`, while the step
        # above it ("The deploy is configured") read the same secret and
        # passed. `${{ }}` is substituted by Actions on the RUNNER, before the
        # script is sent, so there is no forwarding left to get wrong.
        #
        # A single quote in a path would break the assignment. No real deploy
        # path has one, and a silent `cd ""` costs more than this caveat.
        with:
          host: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          username: ${{ secrets.IKIGAI_DEPLOY_USER }}
          key: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu

            IKIGAI_DEPLOY_PATH='${{ secrets.IKIGAI_DEPLOY_PATH }}'
            IKIGAI_IMAGE='${{ steps.target.outputs.tag }}'
            IKIGAI_HARNESS_IMAGE='${{ steps.target.outputs.harness }}'
            # Optional, and UNSET today: the four deploy secrets are the host,
            # the user, the key and the path. With no `read:packages` token
            # the pulls are anonymous; see the retry below.
            IKIGAI_GHCR_TOKEN='${{ secrets.IKIGAI_DEPLOY_GHCR_TOKEN }}'
            IKIGAI_GHCR_USER='${{ secrets.IKIGAI_DEPLOY_GHCR_USER }}'

            : "${IKIGAI_DEPLOY_PATH:?the deploy path is not set}"
            : "${IKIGAI_IMAGE:?the image tag is not set}"
            : "${IKIGAI_HARNESS_IMAGE:?the harness image tag is not set}"

            cd "$IKIGAI_DEPLOY_PATH"

            # THE CLONE'S REMOTE, BEFORE THE FETCH.
            #
            # This box's clone was configured with a NARROW refspec —
            # `+refs/heads/feat/harness-container:refs/remotes/origin/...` —
            # so `git fetch --all` brought that one branch and NEVER `main`.
            # `git checkout main` then landed on a stale local branch and
            # `git pull --ff-only` refused to fast-forward. The deploy had
            # every secret set and could not reach the commit it had just
            # built: a deploy that builds one commit and runs another is worse
            # than one that stops.
            #
            # The refspec is repaired here, on every run, so a clone that was
            # set up by hand cannot make the pipeline lie again.
            git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
            git fetch --all --tags --prune
            git checkout -q -B main origin/main
            git reset --hard origin/main
            echo "deploying $(git log --oneline -1)"

            # The compose file is NOT at the root of the repository: it is
            # `deploy/compose.yml`. The compose file, the `.env` and the
            # relative volume paths all resolve from the directory that holds
            # the compose file, so the deploy runs from there.
            cd deploy
            if [ ! -f compose.yml ]; then
              echo "deploy/compose.yml is not where the deploy expects it"
              exit 1
            fi

            export IKIGAI_IMAGE IKIGAI_HARNESS_IMAGE

            # GHCR: the packages are PRIVATE and this host has no token, so
            # the pulls are ANONYMOUS — and an anonymous pull of a package
            # published seconds ago is FLAKY. Measured: `denied` on the
            # manifest for a tag that pulled fine minutes later, and a
            # `docker compose pull` denied while the same image came down by
            # name. So:
            #
            #   * `docker compose pull` is NOT used. It HEADs every manifest,
            #     and that is the request the registry denies. The two images
            #     are named explicitly and `up --no-build` uses what is here.
            #   * a tag already on disk is not pulled at all, which makes a
            #     redeploy of the same commit immune to the flakiness;
            #   * a pull that fails is retried, with a growing wait.
            #
            # Add `IKIGAI_DEPLOY_GHCR_TOKEN` (a PAT with `read:packages`) and
            # `IKIGAI_DEPLOY_GHCR_USER` to make it authenticated instead.
            if [ -n "$IKIGAI_GHCR_TOKEN" ]; then
              echo "$IKIGAI_GHCR_TOKEN" \
                | docker login ghcr.io --username "${IKIGAI_GHCR_USER:-owner}" --password-stdin
              echo "pulling as an authenticated client"
            else
              echo "no GHCR token: pulling anonymously, with retries"
            fi

            for image in "$IKIGAI_IMAGE" "$IKIGAI_HARNESS_IMAGE"; do
              if docker image inspect "$image" >/dev/null 2>&1; then
                echo "already on this host: $image"
                continue
              fi
              attempt=1
              while :; do
                if docker pull "$image"; then break; fi
                if [ "$attempt" -ge 5 ]; then
                  echo "::error::the image $image could not be pulled after $attempt attempts"
                  echo "If the registry keeps refusing, add IKIGAI_DEPLOY_GHCR_TOKEN (read:packages)."
                  exit 1
                fi
                wait_s=$((attempt * 5))
                echo "pull $attempt/5 failed for $image; retrying in ${wait_s}s"
                sleep "$wait_s"
                attempt=$((attempt + 1))
              done
            done

            docker compose up -d --remove-orphans --no-build

            # The deploy succeeds only when the SERVICE is healthy. A deploy
            # that reports success while the api is down is the green lie the
            # healthcheck exists to prevent (contract C-2), and it is a lie
            # that costs a day: the first sign is a client that cannot write.
            #
            # The AGENT is not waited for: its readiness measures the
            # PROVIDER (the model has to resolve), and a provider that is
            # down must not fail the deploy of the store.
            docker compose up -d --wait --wait-timeout 240 db api ws sync bot
            docker compose ps
