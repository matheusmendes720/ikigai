name: Deploy

# The CI/CD half of the service (ADR-039).
#
# The image is built ONCE, on the runner, and the server runs THAT image —
# not one it builds itself. A server that builds on deploy compiles the
# deploy, and a deploy that compiles something else than CI tested is a
# deploy nobody verified.
#
# Three steps: build the image, push it to GHCR, and tell the server to run
# it. The gates in `ci.yml` run first — a red gate here means the code was
# never tested, and the deploy skips itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping deploys would race for the same
# compose project, and the loser would leave the services in a state neither
# of them chose.
concurrency:
  group: ikigai-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish the image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: The image name
        id: image
        run: |
          # GHCR paths are lowercase; the repository owner is not always
          # spelled that way in the event payload.
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ikigai" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: The image tag to run
        id: target
        run: echo "tag=${{ needs.build.outputs.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # The deploy is configured by four secrets, and a deploy that is not
      # configured must say WHICH are missing. The action's own failure
      # ("missing server host") names one of them and leaves the other three
      # to a guess — and the owner has never seen these names before.
      - name: The deploy is configured
        env:
          DEPLOY_HOST: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.IKIGAI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.IKIGAI_DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("IKIGAI_DEPLOY_HOST")
          [ -n "$DEPLOY_USER" ] || missing+=("IKIGAI_DEPLOY_USER")
          [ -n "$DEPLOY_KEY" ] || missing+=("IKIGAI_DEPLOY_SSH_KEY")
          [ -n "$DEPLOY_PATH" ] || missing+=("IKIGAI_DEPLOY_PATH")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the deploy is not configured — missing ${missing[*]}"
            echo "Set them in the repository: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        # `envs` is what reaches the REMOTE script. The step's own `env:` is
        # the runner's environment and the remote never sees it — so a script
        # that reads a variable the step declared, and not the action, reads
        # an empty string on the other side. This is the difference between a
        # deploy that works and a `cd ""` that fails with the secrets set.
        with:
          host: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          username: ${{ secrets.IKIGAI_DEPLOY_USER }}
          key: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
          envs: IKIGAI_IMAGE=${{ steps.target.outputs.tag }},IKIGAI_DEPLOY_PATH=${{ secrets.IKIGAI_DEPLOY_PATH }}
          script: |
            set -eu

            : "${IKIGAI_DEPLOY_PATH:?the deploy path is not set}"
            : "${IKIGAI_IMAGE:?the image tag is not set}"

            cd "$IKIGAI_DEPLOY_PATH"
            git fetch --all --tags
            git checkout main
            git pull --ff-only origin main

            export IKIGAI_IMAGE
            # `pull` fetches the image CI just pushed; `--no-build` keeps the
            # server from building its own. A private package needs the
            # registry to be known on THIS host: the owner logs in once
            # (`docker login ghcr.io`) and the deploy never carries the token.
            if ! docker pull "$IKIGAI_IMAGE" >/dev/null; then
              echo "the image could not be pulled — a private package needs 'docker login ghcr.io' on this host, once"
              exit 1
            fi
            docker compose pull
            docker compose up -d --remove-orphans --no-build
            docker compose ps
