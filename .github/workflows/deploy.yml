name: Deploy

# The CI/CD half of the service (ADR-039).
#
# The image is built ONCE, on the runner, and the server runs THAT image —
# not one it builds itself. A server that builds on deploy compiles the
# deploy, and a deploy that compiles something else than CI tested is a
# deploy nobody verified.
#
# TWO images, because the compose has two kinds of container: the canonical
# Python service (the api, the websocket, the ingestion and the bot) and the
# AGENT, which is external (ADR-037 D7) and therefore has its own runtime and
# its own image. `docker compose pull` pulls EVERY image the compose names —
# so an image the pipeline does not publish is a deploy that cannot finish.
#
# The gates in `ci.yml` run first — a red gate here means the code was never
# tested, and the deploy skips itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping deploys would race for the same
# compose project, and the loser would leave the services in a state neither
# of them chose.
concurrency:
  group: ikigai-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish the images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      harness_image: ${{ steps.harness_image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: The image name
        id: image
        run: |
          # GHCR paths are lowercase; the repository owner is not always
          # spelled that way in the event payload.
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ikigai" >> "$GITHUB_OUTPUT"

      - name: The harness image name
        id: harness_image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ikigai-harness" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # ONE TAG, and it names the commit.
          #
          # The metadata action used to publish a second tag, `latest`, on
          # the default branch. Nothing consumed it — the deploy pulls
          # `sha-<commit>` — and a floating tag is a second truth about what
          # a build is: the registry holds "the newest main" beside "the
          # commit that was tested", and the two drift apart the moment main
          # moves. It is also the tag a human reaches for by mistake, on a
          # box that runs something else entirely.
          #
          # A tag that names the commit cannot drift: it resolves to exactly
          # the image CI built and CI tested.
          tags: |
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The agent has its OWN image (ADR-037 D7): the model runtime does not
      # belong in the canonical service's build. It is published HERE, by the
      # same pipeline, because the compose names it and `docker compose pull`
      # pulls every image the compose names — an image nobody published is a
      # deploy that stops at the pull.
      - name: Harness image metadata
        id: harness_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.harness_image.outputs.name }}
          # The same one rule as the canonical image above: the agent's tag
          # names the commit too, or it is not the agent CI tested.
          tags: |
            type=sha,format=long

      - name: Build and push the harness image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/harness/Dockerfile
          push: true
          tags: ${{ steps.harness_meta.outputs.tags }}
          labels: ${{ steps.harness_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: The image tags to run
        id: target
        run: |
          # The same tag the metadata action pushed: `sha-<commit>`. The
          # publisher and the deployer must name the image the same way — a
          # deploy that pulls a tag nobody pushed stops on a manifest that
          # does not exist.
          echo "tag=${{ needs.build.outputs.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "harness=${{ needs.build.outputs.harness_image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # The deploy is configured by four secrets, and a deploy that is not
      # configured must say WHICH are missing. The action's own failure
      # ("missing server host") names one of them and leaves the other three
      # to a guess — and the owner has never seen these names before.
      - name: The deploy is configured
        env:
          DEPLOY_HOST: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.IKIGAI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.IKIGAI_DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("IKIGAI_DEPLOY_HOST")
          [ -n "$DEPLOY_USER" ] || missing+=("IKIGAI_DEPLOY_USER")
          [ -n "$DEPLOY_KEY" ] || missing+=("IKIGAI_DEPLOY_SSH_KEY")
          [ -n "$DEPLOY_PATH" ] || missing+=("IKIGAI_DEPLOY_PATH")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the deploy is not configured — missing ${missing[*]}"
            echo "Set them in the repository: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy over SSH
        # PLAIN SSH, AND NOT THE ACTION.
        #
        # `appleboy/ssh-action` downloads the `drone-ssh` binary from GitHub
        # Releases on EVERY run, and that download is the pipeline's weakest
        # link: measured, a run died on six consecutive `504`s from the
        # release CDN — the action's own `curl --retry 5` gave up after 31
        # seconds of refusals, and the deploy was red for a reason that had
        # nothing to do with the commit it was shipping.
        #
        # The runner's own `ssh` does the same job with nothing to download.
        # The remote script is written to a file and piped over stdin
        # (`bash -s`), which is exactly what the action did with it, and the
        # attempt is retried here — the script is idempotent (it checks out
        # `origin/main`, resets the tree, skips images already on disk and
        # re-runs `compose up`), so a retry cannot half-apply anything.
        #
        # THE VALUES ARE INTERPOLATED INTO THE SCRIPT, and not carried by an
        # action's `envs:`. Measured on two deploys: with `envs:` set, the
        # remote script received NONE of them — `bash: line 3:
        # IKIGAI_DEPLOY_PATH: the deploy path is not set`, while the step
        # above it ("The deploy is configured") read the same secret and
        # passed. `${{ }}` is substituted by Actions on the RUNNER, before the
        # script is sent, so there is no forwarding left to get wrong.
        #
        # A single quote in a path would break the assignment. No real deploy
        # path has one, and a silent `cd ""` costs more than this caveat.
        env:
          IKIGAI_DEPLOY_HOST: ${{ secrets.IKIGAI_DEPLOY_HOST }}
          IKIGAI_DEPLOY_USER: ${{ secrets.IKIGAI_DEPLOY_USER }}
          IKIGAI_DEPLOY_KEY: ${{ secrets.IKIGAI_DEPLOY_SSH_KEY }}
        run: |
            set -eu

            # The key never reaches the box: it is a file the runner uses and
            # then deletes, and it is written with the mode ssh insists on.
            key_file="$RUNNER_TEMP/deploy_key"
            printf '%s\n' "$IKIGAI_DEPLOY_KEY" > "$key_file"
            chmod 600 "$key_file"

            cat > "$RUNNER_TEMP/deploy.sh" <<'DEPLOY_SCRIPT'
            set -eu

            IKIGAI_DEPLOY_PATH='${{ secrets.IKIGAI_DEPLOY_PATH }}'
            IKIGAI_IMAGE='${{ steps.target.outputs.tag }}'
            IKIGAI_HARNESS_IMAGE='${{ steps.target.outputs.harness }}'
            # THE REGISTRY CREDENTIAL, and it is the job's OWN token.
            #
            # The images are PRIVATE: an anonymous pull of a tag that exists is
            # `denied: denied`, measured five times in a row on the manifest of
            # an image the build job had published seconds earlier. So there is
            # no anonymous path, and the earlier hope that there was one is
            # what kept this pipeline red.
            #
            # `GITHUB_TOKEN` can read THIS repository's packages when the job
            # asks for `packages:` — this workflow asks for `write` — it costs
            # no new secret, and it expires in an hour. The host had a `ghs_`
            # App token stored from a manual login and GHCR refuses it now.
            #
            # An explicit PAT wins when the owner configures one: it is the
            # escape hatch for a package that stops being readable by the
            # actions token, and it is not required.
            IKIGAI_GHCR_TOKEN='${{ secrets.IKIGAI_DEPLOY_GHCR_TOKEN }}'
            IKIGAI_GHCR_USER='${{ secrets.IKIGAI_DEPLOY_GHCR_USER }}'
            if [ -z "$IKIGAI_GHCR_TOKEN" ]; then
              IKIGAI_GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'
              IKIGAI_GHCR_USER='${{ github.actor }}'
            fi

            : "${IKIGAI_DEPLOY_PATH:?the deploy path is not set}"
            : "${IKIGAI_IMAGE:?the image tag is not set}"
            : "${IKIGAI_HARNESS_IMAGE:?the harness image tag is not set}"

            cd "$IKIGAI_DEPLOY_PATH"

            # THE CLONE'S REMOTE, BEFORE THE FETCH.
            #
            # This box's clone was configured with a NARROW refspec —
            # `+refs/heads/feat/harness-container:refs/remotes/origin/...` —
            # so `git fetch --all` brought that one branch and NEVER `main`.
            # `git checkout main` then landed on a stale local branch and
            # `git pull --ff-only` refused to fast-forward. The deploy had
            # every secret set and could not reach the commit it had just
            # built: a deploy that builds one commit and runs another is worse
            # than one that stops.
            #
            # The refspec is repaired here, on every run, so a clone that was
            # set up by hand cannot make the pipeline lie again.
            git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
            git fetch --all --tags --prune
            git checkout -q -B main origin/main
            git reset --hard origin/main
            echo "deploying $(git log --oneline -1)"

            # The compose file is NOT at the root of the repository: it is
            # `deploy/compose.yml`. The compose file, the `.env` and the
            # relative volume paths all resolve from the directory that holds
            # the compose file, so the deploy runs from there.
            cd deploy
            if [ ! -f compose.yml ]; then
              echo "deploy/compose.yml is not where the deploy expects it"
              exit 1
            fi

            export IKIGAI_IMAGE IKIGAI_HARNESS_IMAGE

            # GHCR. The packages are PRIVATE and the pull is authenticated —
            # see the credential at the top of this script. Three smaller
            # things are still worth having here, because each of them cost a
            # red deploy:
            #
            #   * `docker compose pull` is NOT used. It HEADs every manifest,
            #     and that is the request the registry refuses; the two images
            #     are named explicitly and `up --no-build` uses what is here.
            #   * a tag already on disk is not pulled at all, which makes a
            #     redeploy of the same commit immune to the registry;
            #   * a pull that fails is retried, because a package published
            #     seconds ago is not always readable seconds later.
            #
            # The login REPLACES whatever credential the host had: a stale one
            # is worse than none, because docker tries it and gets `denied`
            # with no hint that the token is the problem.
            if ! echo "$IKIGAI_GHCR_TOKEN" \
                | docker login ghcr.io --username "$IKIGAI_GHCR_USER" --password-stdin; then
              echo "::error::ghcr.io refused the login for '$IKIGAI_GHCR_USER'"
              exit 1
            fi

            for image in "$IKIGAI_IMAGE" "$IKIGAI_HARNESS_IMAGE"; do
              if docker image inspect "$image" >/dev/null 2>&1; then
                echo "already on this host: $image"
                continue
              fi
              attempt=1
              while :; do
                if docker pull "$image"; then break; fi
                if [ "$attempt" -ge 5 ]; then
                  echo "::error::the image $image could not be pulled after $attempt attempts"
                  echo "If the registry keeps refusing, add IKIGAI_DEPLOY_GHCR_TOKEN (read:packages)."
                  exit 1
                fi
                wait_s=$((attempt * 5))
                echo "pull $attempt/5 failed for $image; retrying in ${wait_s}s"
                sleep "$wait_s"
                attempt=$((attempt + 1))
              done
            done

            docker compose up -d --remove-orphans --no-build

            # The deploy succeeds only when the SERVICE is healthy. A deploy
            # that reports success while the api is down is the green lie the
            # healthcheck exists to prevent (contract C-2), and it is a lie
            # that costs a day: the first sign is a client that cannot write.
            #
            # The AGENT is not waited for: its readiness measures the
            # PROVIDER (the model has to resolve), and a provider that is
            # down must not fail the deploy of the store.
            docker compose up -d --wait --wait-timeout 240 db api ws sync bot
            docker compose ps

            # THE PUBLISHED SURFACES. The route lives in the repository
            # (`deploy/surfaces.json`); this applies it to the box's tailscale
            # config, after the services are up, and it touches ONLY the
            # host:port and path the table declares.
            #
            # It runs AFTER the compose wait on purpose: the route points at a
            # service, and a route that points at a service that is not up yet
            # is a route that answers with a 502.
            if [ ! -f apply-surfaces.sh ]; then
              echo "::error::deploy/apply-surfaces.sh is missing — the declared route would not be applied"
              exit 1
            fi
            bash apply-surfaces.sh
            DEPLOY_SCRIPT

            # THE ATTEMPT. Three tries, with a growing wait, because the
            # failure modes this deploy has actually suffered are transient:
            # a release CDN in 504, a registry that has not caught up with the
            # tag that was published seconds ago, a host that was busy.
            #
            # `BatchMode=yes` matters more than it looks: without it, a key
            # that does not authenticate asks for a password, and a
            # non-interactive runner waits on that prompt until the job dies
            # with no error at all.
            attempt=1
            while :; do
              if ssh -i "$key_file" \
                  -o IdentitiesOnly=yes \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=accept-new \
                  -o ConnectTimeout=30 \
                  -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=20 \
                  "${IKIGAI_DEPLOY_USER}@${IKIGAI_DEPLOY_HOST}" \
                  'bash -s' < "$RUNNER_TEMP/deploy.sh"; then
                rm -f "$key_file"
                exit 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::the deploy failed after $attempt attempts"
                rm -f "$key_file"
                exit 1
              fi
              wait_s=$((attempt * 20))
              echo "::warning::deploy attempt $attempt failed; retrying in ${wait_s}s"
              sleep "$wait_s"
              attempt=$((attempt + 1))
            done

  published-surface:
    name: The published surface (live, outside the tailnet)
    needs: deploy
    runs-on: ubuntu-latest
    # THE EFFECT GATE. The contract gate lives in the CI (`ci.yml`, the job
    # *The published surface (gate próprio)*); this one measures the EFFECT:
    # the surface the repository declares as published has to answer FROM
    # OUTSIDE the tailnet, and its data door has to be closed.
    #
    # The runner is not in the tailnet, and that is the whole point of
    # probing from here: a probe from inside the tailnet would answer even
    # with the funnel off, and would prove nothing about publication.
    #
    # It runs only when the table says `published`. A surface that is
    # declared but not published is not a failure — it is a decision that has
    # not been taken yet (ADR-045 D3).
    steps:
      - uses: actions/checkout@v4

      - name: The surface, as the repository declares it
        id: surface
        run: |
          state=$(jq -r '.surfaces.miniapp.state // "absent"' deploy/surfaces.json)
          url=$(jq -r '.surfaces.miniapp | "https://" + .host + (if .https_port == 443 then "" else ":" + (.https_port|tostring) end) + .path' deploy/surfaces.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "the surface is declared as '$state' at $url"

      - name: The surface answers from outside the tailnet
        if: steps.surface.outputs.state == 'published'
        env:
          SURFACE_URL: ${{ steps.surface.outputs.url }}
        run: |
          base="${SURFACE_URL%/}"
          page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/")
          if [ "$page" != "200" ]; then
            echo "::error::the published surface's page answered '$page' at $base/ — the surface is not published"
            exit 1
          fi
          door=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST -d '{}' "$base/api/session")
          if [ "$door" != "401" ]; then
            echo "::error::the published surface's data door answered '$door' — it must answer 401 without Telegram's signature"
            exit 1
          fi
          echo "the surface answers 200 and its data door answers 401: published, and closed"
