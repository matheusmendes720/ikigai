# The canonical service, on one box (ADR-037, renewed scope 2026-11-02;
# ADR-039 adds the websocket and the ingestion).
#
# FIVE containers, one compose: the store, the API (MCP over HTTP), the
# websocket (the bi-directional sync channel), the Telegram bot and the vault
# ingestion. They all run the SAME image — the role is the command, not the
# build. They share the contracts, the store client and the service layer, so
# they must not be allowed to drift apart in the build.
#
# Secrets never live here: the DSN, the bot token and the websocket token come
# from the environment (contract C-5). Copy `.env.example` to `.env` and fill
# it in; `.env*` is gitignored, and the secret is never committed.
#
#   docker compose up -d --build
#   docker compose exec db psql -U ikigai -d ikigai -c '\dt'
#
# The image is published to GHCR and the CI/CD workflow pushes it before the
# deploy — `IKIGAI_IMAGE` names which tag this compose runs. The default is
# the repository's own registry path, so a plain `docker compose up -d` on a
# fresh clone still builds and runs the same thing.
name: ikigai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${IKIGAI_DB_NAME:-ikigai}
      POSTGRES_USER: ${IKIGAI_DB_USER:-ikigai}
      POSTGRES_PASSWORD: ${IKIGAI_DB_PASSWORD:?set IKIGAI_DB_PASSWORD in .env}
      # NO search_path here, and that is a decision, not an omission.
      # POSTGRES_INITDB_ARGS is handed to `initdb`, which has no such option:
      # the container exits 1 on "invalid option" and restarts forever. It
      # would not have worked even if it did — `ikig` does not exist at initdb
      # time. And it is not needed: every table the service, the migrations
      # and the RLS policies touch is `ikig.`-qualified, and the schema itself
      # is created by 0001_init.sql.
    volumes:
      # WHERE the store lives. The default is a Docker named volume, because
      # that is what a local checkout wants: portable, disposable, and it
      # never touches the root disk of a machine that has a real one.
      #
      # On the deployment box, `IKIGAI_PGDATA` points at a directory on the
      # Cloud Volume — the block device that outlives a rebuilt server — so
      # the DOM survives the server. The variable is the whole mechanism:
      # a path is a bind mount, a name is a named volume, and the compose file
      # does not have to know which one it is.
      - ${IKIGAI_PGDATA:-db-data}:/var/lib/postgresql/data
    # /dev/shm for the parallel HNSW build. Docker's default is 64MB, and
    # pgvector fails the build when the shared memory is smaller than
    # maintenance_work_mem — a failure that reads like a bug in the extension
    # and is not one.
    shm_size: "1g"
    # The store's tuning, for a PGDATA that is not on a local disk.
    #
    # These are a CONTRACT, not preferences. The write path carries a
    # revision and an idempotency key, and a stale revision is a 409 — so an
    # acknowledged write that is not durable is a DOM that diverges from what
    # the client believes. `synchronous_commit=off` does not corrupt
    # anything: it loses the last acknowledged transactions on a crash, which
    # is the same thing said out loud.
    command:
      - postgres
      # -- memory -------------------------------------------------------
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      # The HNSW graph needs room: pgvector spills and the build crawls when
      # it does not fit. 256MB x 2 workers + the leader stays under the 1GB
      # of /dev/shm above.
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - max_parallel_workers=3
      # -- durability: DO NOT TOUCH -------------------------------------
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      # -- less fsync in a burst ----------------------------------------
      # A checkpoint that writes 64MB of WAL at once is a burst of fsyncs on
      # a device that does 5.000 IOPS. A bigger WAL spreads the same bytes.
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - checkpoint_timeout=15min
      # -- it is an SSD, but it is on the network ------------------------
      # The default random_page_cost says "spinning disk"; the volume is
      # SSD-backed, so the planner should not avoid the index.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # -- vacuum earlier -----------------------------------------------
      # A storage device that is not local is slow to rewrite, so the
      # autovacuum thresholds come down.
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IKIGAI_DB_USER:-ikigai} -d ${IKIGAI_DB_NAME:-ikigai}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IKIGAI_IMAGE:-ghcr.io/matheusmendes720/ikigai:latest}
    # The api applies the migrations before it serves. The runner is
    # idempotent and takes an advisory lock, so this is safe with more than
    # one replica — and it means a broken schema is a container that never
    # comes up, not a "healthy" service that answers every write with an
    # error. The bot waits for the api to be healthy, so the chain holds.
    command:
      - sh
      - -c
      - "python -m src.contracts.migrations.apply up && exec python -m src.transport.mcp_server"
    environment:
      IKIGAI_STORE_DSN: postgresql://${IKIGAI_DB_USER:-ikigai}:${IKIGAI_DB_PASSWORD}@db:5432/${IKIGAI_DB_NAME:-ikigai}
      # ADR-011: `http` is what a cloud deployment needs; `stdio` is the local
      # harness path.
      IKIGAI_MCP_TRANSPORT: ${IKIGAI_MCP_TRANSPORT:-http}
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8000"
      # The embedding provider. `local` needs nothing and is the default; a
      # real model is a base URL, a model name and a key. The api embeds
      # every write, so this is what decides whether the vector index holds
      # something meaningful.
      IKIGAI_EMBEDDING_PROVIDER: ${IKIGAI_EMBEDDING_PROVIDER:-local}
      IKIGAI_EMBEDDING_BASE_URL: ${IKIGAI_EMBEDDING_BASE_URL:-}
      IKIGAI_EMBEDDING_MODEL: ${IKIGAI_EMBEDDING_MODEL:-}
      IKIGAI_EMBEDDING_API_KEY: ${IKIGAI_EMBEDDING_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback on purpose: the public surface is the Telegram bot
      # and (later) a reverse proxy, not an open MCP port.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ws:
    # The websocket: the bi-directional sync channel (ADR-039). It is a
    # SEPARATE surface on its own port — not a seventh tool, and not a
    # replacement for the MCP transport: the harness keeps speaking MCP, and
    # the clients that need to know what changed speak the websocket.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IKIGAI_IMAGE:-ghcr.io/matheusmendes720/ikigai:latest}
    command: ["python", "-m", "src.transport.ws_server"]
    environment:
      IKIGAI_STORE_DSN: postgresql://${IKIGAI_DB_USER:-ikigai}:${IKIGAI_DB_PASSWORD}@db:5432/${IKIGAI_DB_NAME:-ikigai}
      IKIGAI_WS_HOST: 0.0.0.0
      IKIGAI_WS_PORT: "8001"
      # The websocket is a WRITE channel. It refuses to start without a
      # token, and the token is the only thing between "the bot" and "anyone
      # who reached the network".
      IKIGAI_WS_TOKEN: ${IKIGAI_WS_TOKEN:?set IKIGAI_WS_TOKEN in .env}
      IKIGAI_EMBEDDING_PROVIDER: ${IKIGAI_EMBEDDING_PROVIDER:-local}
      IKIGAI_EMBEDDING_BASE_URL: ${IKIGAI_EMBEDDING_BASE_URL:-}
      IKIGAI_EMBEDDING_MODEL: ${IKIGAI_EMBEDDING_MODEL:-}
      IKIGAI_EMBEDDING_API_KEY: ${IKIGAI_EMBEDDING_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      # The same probe as the api's, pointed at THIS surface: it writes a row
      # and throws it away, then dials the address a client uses.
      test:
        - CMD-SHELL
        - "python -m src.transport.healthcheck --host 0.0.0.0 --port 8001"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  sync:
    # The ingestion: the vault prose into the store, and from there into the
    # vector index. It is its own container because it is its own cadence —
    # it runs on a timer, not on a request — and because it is the writer
    # whose writes the other clients have to learn about.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IKIGAI_IMAGE:-ghcr.io/matheusmendes720/ikigai:latest}
    command:
      - sh
      - -c
      - "exec python -m src.services.sync --interval ${IKIGAI_VAULT_SYNC_INTERVAL:-60}"
    environment:
      IKIGAI_STORE_DSN: postgresql://${IKIGAI_DB_USER:-ikigai}:${IKIGAI_DB_PASSWORD}@db:5432/${IKIGAI_DB_NAME:-ikigai}
      # Where the prose lives. The volume below is mounted read-only: the
      # ingestion reads the vault and NEVER writes it (ADR-012).
      IKIGAI_VAULT_ROOTS: ${IKIGAI_VAULT_ROOTS:-/app/vault/ikigai/closing-2026=closing}
      IKIGAI_EMBEDDING_PROVIDER: ${IKIGAI_EMBEDDING_PROVIDER:-local}
      IKIGAI_EMBEDDING_BASE_URL: ${IKIGAI_EMBEDDING_BASE_URL:-}
      IKIGAI_EMBEDDING_MODEL: ${IKIGAI_EMBEDDING_MODEL:-}
      IKIGAI_EMBEDDING_API_KEY: ${IKIGAI_EMBEDDING_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The vault as a VOLUME, not as a copy baked into the image. The image
      # carries the prose of the commit it was built from; the volume carries
      # the prose of NOW, and it is the same directory the owner edits. A
      # container that only sees the baked copy cannot see a change until it
      # is rebuilt — and the retrieval layer would answer from last week's
      # memory while the vault says otherwise.
      #
      # `../vault`, and NOT `./vault`: a relative path in a compose file is
      # resolved against the PROJECT DIRECTORY, which is the directory of the
      # compose file itself — `deploy/`. `./vault` therefore named
      # `deploy/vault`, which is not in the repository: docker would have
      # created it EMPTY, and the ingestion would have read nothing while
      # looking healthy. The vault is tracked at the repository root, one
      # level up.
      - ../vault:/app/vault:ro
    healthcheck:
      # The ingestion is a WORKER: it holds a DSN and serves no surface. It
      # cannot inherit the image's healthcheck — that one dials the MCP
      # transport on 8000, which the ingestion never opens, so the container
      # would report unhealthy forever. A container that reports unhealthy
      # forever is a lie in the other direction, and a deploy that waits for
      # health would never finish. What the ingestion actually depends on is
      # the STORE: it writes the vault into it, and the retrieval layer reads
      # it back. So the check measures the store.
      test:
        - CMD-SHELL
        - "python -m src.transport.healthcheck --store-only"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IKIGAI_IMAGE:-ghcr.io/matheusmendes720/ikigai:latest}
    command: ["python", "-m", "src.bot.main"]
    environment:
      # NOTE: no IKIGAI_STORE_DSN here on purpose. The bot is a CLIENT of the
      # api: it speaks MCP and does not touch the store (ADR-037 D6). Giving
      # it a DSN would be a second writer waiting to happen (D5).
      IKIGAI_BOT_TOKEN: ${IKIGAI_BOT_TOKEN:?set IKIGAI_BOT_TOKEN in .env}
      IKIGAI_MCP_URL: http://api:8000/mcp
      # The websocket gives the bot the other direction: it receives what the
      # store changed, including the writes made by the ingestion above.
      #
      # The scheme is `ws://`, NOT `http://`. They share port 8001, and that
      # is exactly the trap: `http://` is a different protocol on the same
      # port, so the client refuses the URL and the bot's whole store leg —
      # search, read, write, the change stream — dies while the container
      # still reports healthy. Measured on the box: `http://` failed in 591 ms
      # ("scheme isn't ws or wss"), `ws://` answered a real call in 99 ms.
      IKIGAI_WS_URL: ws://ws:8001/sync
      IKIGAI_WS_TOKEN: ${IKIGAI_WS_TOKEN:?set IKIGAI_WS_TOKEN in .env}
      IKIGAI_CLIENT_ID: ${IKIGAI_CLIENT_ID:-owner}
      IKIGAI_BOT_ALLOWED_CHAT_IDS: ${IKIGAI_BOT_ALLOWED_CHAT_IDS:?set IKIGAI_BOT_ALLOWED_CHAT_IDS in .env}
      # The AGENT's door (ADR-037 D7). The owner asks for a cadence and the
      # harness runs it; the bot asks, waits, and reports what the agent
      # said. The bot does not become an orchestrator, and it does not gain a
      # DSN: the agent writes through the api like every other client, so
      # there is still one writer per store.
      #
      # It is NOT required, on purpose. The bot without the agent still
      # writes, searches and reads — it just refuses the routines with a
      # reason, instead of refusing to start.
      IKIGAI_HARNESS_URL: ${IKIGAI_HARNESS_URL:-http://harness:8002}
      # The ceiling of a routine, in seconds. The harness bounds the run with
      # the same number, so the two agree on who gives up first.
      IKIGAI_HARNESS_TIMEOUT_S: ${IKIGAI_HARNESS_TIMEOUT_S:-600}
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy
      harness:
        # NOT service_healthy, and the difference matters. The harness's deep
        # probe spawns a real agent to ask it for a model, and the bot must
        # not wait for that to be able to write a note. The bot needs the
        # harness to be THERE, not to be ready — a routine that finds the
        # door closed says so, and the owner retries.
        condition: service_started
    # The image's healthcheck measures the STORE — and the bot has none: it
    # is a client of the api (ADR-037 D5), which is exactly why it holds no
    # DSN. Left as it is, the bot would report "unhealthy" forever, which is
    # a lie in the other direction. What the bot actually depends on is the
    # api's MCP endpoint being reachable from it.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,socket,urllib.parse as u;
          p=u.urlparse(os.environ['IKIGAI_MCP_URL']);
          socket.create_connection((p.hostname, p.port or 80), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  harness:
      # The AGENT (ADR-037 D7: the harness is external). It gets its OWN image
      # and its OWN runtime, because it is not part of the canonical service:
      # the api, the websocket, the ingestion and the bot share the contracts,
      # the store client and the service layer, and the agent shares none of
      # them — it speaks MCP to the api, exactly like the bot does, and it never
      # opens the database.
      #
      # It is the sixth container of the compose and the first one that is NOT
      # the Python image: the agent is a Node process. That is the point of
      # ADR-037 D7 — the model runtime does not leak into the product.
      build:
        context: ..
        dockerfile: deploy/harness/Dockerfile
      image: ${IKIGAI_HARNESS_IMAGE:-ghcr.io/matheusmendes720/ikigai-harness:latest}
      environment:
        # The harness reaches the store through the api's MCP — the same door
        # the bot uses. It is NOT given a DSN: two writers of one store is the
        # thing ADR-037 D5 forbids, and a DSN in this container would be a
        # second writer waiting to happen.
        IKIGAI_MCP_URL: http://api:8000/mcp
        # The provider and the model are ENVIRONMENT: the container talks to
        # whatever endpoint the operator points it at, without a rebuild.
        #
        # The KEY is NOT here, and it is not an oversight. An `environment:`
        # entry is not a secret store: `docker inspect` prints it, the
        # container's `/proc/1/environ` holds it, and every child process
        # inherits it. Measured on the box before this change: `docker inspect`
        # returned the 125-character key in `Config.Env`, and
        # `tr '\0' '\n' < /proc/1/environ` found it inside the container.
        # It arrives as a FILE instead — see the `secrets:` block at the bottom
        # of this file and the `!cat` in the harness's entrypoint.
        HARNESS_PROVIDER_ID: ${HARNESS_PROVIDER_ID:-harness}
        HARNESS_PROVIDER_BASE_URL: ${HARNESS_PROVIDER_BASE_URL:?set HARNESS_PROVIDER_BASE_URL in .env}
        HARNESS_PROVIDER_API: ${HARNESS_PROVIDER_API:-anthropic-messages}
        HARNESS_MODEL_ID: ${HARNESS_MODEL_ID:-MiniMax-M2.7}
        HARNESS_MODEL_CONTEXT_WINDOW: ${HARNESS_MODEL_CONTEXT_WINDOW:-204800}
        HARNESS_MODEL_MAX_TOKENS: ${HARNESS_MODEL_MAX_TOKENS:-131072}
        HARNESS_MAX_SESSIONS: ${HARNESS_MAX_SESSIONS:-8}
        HARNESS_SESSION_TTL_MS: ${HARNESS_SESSION_TTL_MS:-900000}
        HARNESS_TIMEOUT_MS: ${HARNESS_TIMEOUT_MS:-600000}
      depends_on:
        api:
          condition: service_healthy
      volumes:
        # The two PROSE inputs, mounted read-only: the image carries the prose
        # of the commit it was built from, the mount carries the prose of NOW.
        # The vault is never written by anything (ADR-012).
        #
        # `../strategics` and `../vault`, and NOT `./strategics` and `./vault`:
        # a relative path in a compose file is resolved against the PROJECT
        # DIRECTORY — the directory of the compose file, which is `deploy/`.
        # `./vault` named `deploy/vault`, which is not in the repository: docker
        # creates it empty, and the container reads nothing while looking
        # healthy. Both trees are tracked at the repository root, one level up.
        - ../strategics:/app/strategics:ro
        - ../vault:/app/vault:ro
        # The agent's own directory: its settings, its sessions and its
        # credentials. A named volume, so a session survives the container.
        - harness-state:/root/.pi/agent
        # The PERSISTENT MEMORY: the SQLite database of what the agent learned.
        # A volume of its own, so the memory outlives the image.
        - harness-memory:/app/memory
      secrets:
        # The provider's key, mounted at /run/secrets/harness_provider_key.
        # The engine writes it there and nothing else sees it: it is not in the
        # environment, so `docker inspect` cannot print it and no child process
        # inherits it. The entrypoint gives pi the PATH — `"apiKey": "!cat
        # /run/secrets/harness_provider_key"` — and pi resolves the value when
        # it is first needed.
        - harness_provider_key
      ports:
        # Bound to loopback: the harness is reached by the api (or the bot),
        # not from the internet.
        - "127.0.0.1:8002:8002"
      restart: unless-stopped

secrets:
  # The provider's API key, as a FILE.
  #
  # WHY A FILE AND NOT A VARIABLE: the compose used to pass
  # `HARNESS_PROVIDER_API_KEY` as an environment entry, and an environment
  # entry is not a secret store. `docker inspect` prints it in `Config.Env`;
  # `/proc/1/environ` inside the container holds it; every process the agent
  # spawns inherits it. Measured on the box before this change — the key was
  # one `docker inspect` away from anyone who could run `docker` there.
  #
  # A file secret is written by the engine at `/run/secrets/<name>` and exists
  # only inside the container that declares it. The engine does not encrypt it
  # at rest, so the filesystem protects it: `deploy/secrets/` is gitignored and
  # the file is mode 600, owned by the deploy user.
  #
  # Regenerate it (never commit it):
  #   install -m 600 /dev/null deploy/secrets/harness_provider_key
  #   printf '%s' '<the key>' > deploy/secrets/harness_provider_key
  #
  # NO TRAILING NEWLINE, on purpose: `!cat` passes the bytes through, and a
  # newline inside an Authorization header breaks the request. `printf '%s'`,
  # never `echo`.
  harness_provider_key:
    file: ./secrets/harness_provider_key

volumes:
  db-data:
  # The agent's sessions and settings.
  harness-state:
  # The agent's persistent memory (SQLite).
  harness-memory:
